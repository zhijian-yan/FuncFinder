name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-linux:
    name: Build Linux package
    # 固定 22.04 (glibc 2.35)，保证产物可运行于 Ubuntu 22.04/24.04 及更新系统。
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xkb1 libfontconfig1 libfreetype6 \
            libdbus-1-3 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build one-file package
        run: |
          python package.py --target linux --no-venv --skip-deps \
            --onefile --archive --glibc-max 2.35

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp dist/linux/FuncFinder "release-assets/FuncFinder-${VERSION}-linux-x86_64"
          cp dist/linux/*.tar.gz "release-assets/FuncFinder-${VERSION}-linux-x86_64.tar.gz"
          ls -lh release-assets

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  verify-linux:
    name: Verify Linux package on ${{ matrix.image }}
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04

    steps:
      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-assets

      - name: Run package inside ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/release-assets:/app" \
            -w /app \
            "${{ matrix.image }}" \
            bash -c '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgl1 libegl1
              bin=$(find . -maxdepth 1 -type f -name "FuncFinder-*-linux-x86_64" | head -n1)
              chmod +x "$bin"
              QT_QPA_PLATFORM=offscreen "$bin" --version
            '

  build-windows:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build one-file package
        run: python package.py --target windows --no-venv --skip-deps --onefile --archive

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp dist/windows/FuncFinder.exe "release-assets/FuncFinder-${VERSION}-windows-x86_64.exe"
          cp dist/windows/*.zip "release-assets/FuncFinder-${VERSION}-windows-x86_64.zip"
          ls -lh release-assets

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - verify-linux
      - build-windows
    # Linux 构建和 22.04/24.04 运行验证通过才发布；Windows 失败时不阻塞 Linux 资产。
    if: ${{ always() && needs['build-linux'].result == 'success' && needs['verify-linux'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Show release assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FuncFinder ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
