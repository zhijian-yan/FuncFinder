name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Build one-file package
        run: python package.py --target linux --no-venv --onefile --archive

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp dist/linux/FuncFinder "release-assets/FuncFinder-${VERSION}-linux-x86_64"
          cp dist/linux/*.tar.gz "release-assets/FuncFinder-${VERSION}-linux-x86_64.tar.gz"
          ls -lh release-assets

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  build-windows:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build one-file package
        run: python package.py --target windows --no-venv --onefile --archive

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp dist/windows/FuncFinder.exe "release-assets/FuncFinder-${VERSION}-windows-x86_64.exe"
          cp dist/windows/*.zip "release-assets/FuncFinder-${VERSION}-windows-x86_64.zip"
          ls -lh release-assets

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-windows
    # Linux 构建成功就发布；Windows 失败时不阻塞 Linux 资产。
    if: ${{ always() && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Show release assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FuncFinder ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
